<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JSON Pilot — promo</title>
    <!--
      The product-site intro film, authored as a web page. Every moving part is a
      Web Animations API animation on one shared timeline, so `seek(seconds)`
      can freeze the page on any frame: scripts/render-promo.mjs steps through
      it frame by frame and encodes the result. Open it directly in a browser
      (add ?lang=zh-CN for Chinese, ?play to run it live) to preview.
    -->
    <link rel="stylesheet" href="./promo.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="./promo.js"></script>
  </body>
</html>
