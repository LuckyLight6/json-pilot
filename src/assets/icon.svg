<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>JSON Pilot</title>
  <!--
    The name, drawn: JSON braces with a paper plane flying through them. A sky
    tile in the brand blue, white glyphs, the plane's wing folded a shade
    darker so it catches light. One shape, bold enough to read at 16px, where
    it is still unmistakably braces and a plane.

    One asset for the browser tab, the app header and the product site;
    scripts/render-assets.mjs rasterises it for touch and install icons. The
    tile bleeds to the viewBox edge on purpose: a transparent margin turns into
    a sub-pixel halo once the favicon is rasterised at 16px.
  -->
  <defs>
    <linearGradient id="sky" x1="8" y1="0" x2="56" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5AB8FF" />
      <stop offset="1" stop-color="#1F6FEB" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.14" />
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#0B3D91" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#sky)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="url(#rim)" stroke-width="1.5" />

  <!-- Glyph -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 15Q14 15 14 20.5V26.5Q14 31 10 32Q14 33 14 37.5V43.5Q14 49 19 49" />
    <path d="M45 15Q50 15 50 20.5V26.5Q50 31 54 32Q50 33 50 37.5V43.5Q50 49 45 49" />
  </g>
  <g filter="url(#lift)">
    <path d="M45.5 19.5L19 30.2L27.4 34.1Z" fill="#FFFFFF" />
    <path d="M45.5 19.5L27.4 34.1L31 44.5Z" fill="#CFE3FF" />
    <path d="M27.4 34.1L31 44.5L32.8 36.4Z" fill="#CFE3FF" opacity="0.7" />
  </g>
</svg>
